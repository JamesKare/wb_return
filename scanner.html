<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сканер возвратов WB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Roboto, sans-serif;
    margin: 0; padding: 16px;
    background: #f5f5f5;
  }
  h1 { font-size: 18px; margin-bottom: 12px; }

  #storeSelect { max-width: 480px; margin: 0 auto 12px; display: flex; gap: 8px; }
  #storeSelect button {
    flex: 1; padding: 12px; border-radius: 8px; border: 2px solid #1a73e8;
    background: white; color: #1a73e8; font-size: 15px; font-weight: 600;
  }
  #storeSelect button.active { background: #1a73e8; color: white; }
  #storeStatus { max-width: 480px; margin: 0 auto 12px; text-align: center; color: #666; font-size: 13px; }

  #reader { width: 100%; max-width: 480px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
  #result {
    max-width: 480px; margin: 16px auto; padding: 16px;
    border-radius: 12px; font-size: 15px; line-height: 1.5;
    display: none;
  }
  #result.ok { background: #e6f4ea; border: 1px solid #34a853; display: block; }
  #result.warn { background: #fef7e0; border: 1px solid #f9ab00; display: block; }
  #result.error { background: #fce8e6; border: 1px solid #ea4335; display: block; }
  #result .badge {
    display: inline-block; padding: 4px 10px; border-radius: 20px;
    font-size: 13px; font-weight: 700; margin-bottom: 8px;
  }
  #result .badge.defect { background: #ea4335; color: white; }
  #result .badge.refusal { background: #4285f4; color: white; }

  #status { text-align: center; color: #666; margin: 8px 0; }

  #debug {
    max-width: 480px; margin: 12px auto; padding: 12px;
    background: #fff; border: 1px solid #ddd; border-radius: 8px;
    font-size: 13px; color: #333; display: none;
  }
  #debug img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
  #debug .raw { font-family: monospace; word-break: break-all; background: #f1f1f1; padding: 6px; border-radius: 4px; }

  button.primary {
    display: block; margin: 12px auto; padding: 12px 24px;
    background: #1a73e8; color: white; border: none; border-radius: 8px;
    font-size: 16px;
  }
  #manualInput { max-width: 480px; margin: 16px auto; display: flex; gap: 8px; }
  #manualInput input { flex: 1; padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; }
</style>
</head>
<body>

<h1>📦 Сканер возвратов WB</h1>

<div id="storeSelect">
  <button id="btnStore1" onclick="selectStore('1')">1-й Магазин</button>
  <button id="btnStore3" onclick="selectStore('3')">3-й Магазин</button>
</div>
<div id="storeStatus">Магазин не выбран</div>

<div id="reader"></div>
<div id="status">Наведите камеру на QR-код</div>
<div id="result"></div>
<div id="debug"></div>

<div id="manualInput">
  <input type="text" id="manualCode" placeholder="Или введите номер вручную">
  <button class="primary" style="margin:0;" onclick="submitCode(document.getElementById('manualCode').value)">OK</button>
</div>

<script>
// ЗАМЕНИТЕ на ваш URL веб-приложения Apps Script (Deploy → Web app)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyNDC9WccSqo6XKxPRyFEkvDFhYna-b4-QU-YqAjAEtsGLHi-aMLfHYyuQtG-DuDttioQ/exec';

const resultDiv = document.getElementById('result');
const statusDiv = document.getElementById('status');
const storeStatusDiv = document.getElementById('storeStatus');
let isProcessing = false;
let selectedStore = localStorage.getItem('wb_selected_store') || '';

function updateStoreUI() {
  document.getElementById('btnStore1').classList.toggle('active', selectedStore === '1');
  document.getElementById('btnStore3').classList.toggle('active', selectedStore === '3');
  storeStatusDiv.textContent = selectedStore
    ? 'Выбран: ' + (selectedStore === '1' ? '1-й Магазин' : '3-й Магазин')
    : 'Магазин не выбран — выберите перед сканированием';
}

function selectStore(key) {
  selectedStore = key;
  localStorage.setItem('wb_selected_store', key);
  updateStoreUI();
}

updateStoreUI();

function showResult(cls, html) {
  resultDiv.className = cls;
  resultDiv.innerHTML = html;
}

function showDebug(rawText, formatName) {
  const debugDiv = document.getElementById('debug');
  debugDiv.style.display = 'block';

  let html = '<b>Сырой результат сканирования:</b><br>' +
    '<div class="raw">' + escapeHtml(rawText) + '</div>' +
    '<div style="margin-top:6px; color:#666;">Формат: ' + (formatName || 'неизвестно') + '</div>';

  const video = document.querySelector('#reader video');
  if (video && video.videoWidth) {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    html += '<b>Снимок в момент считывания:</b>' +
      '<img src="' + canvas.toDataURL('image/jpeg', 0.85) + '">';
  }

  debugDiv.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function submitCode(code) {
  code = (code || '').trim();
  if (!code || isProcessing) return;

  if (!selectedStore) {
    showResult('warn', '⚠️ Сначала выберите магазин (кнопки сверху).');
    return;
  }

  // Стикеры WB содержат чистое число (обычно 6-15 цифр).
  if (!/^\d{6,15}$/.test(code)) {
    showResult('warn', '⚠️ Похоже, код распознан неверно ("' + escapeHtml(code) + '"). ' +
      'Введите номер вручную по цифрам на стикере.');
    document.getElementById('manualCode').value = code.replace(/\D/g, '');
    return;
  }

  isProcessing = true;
  statusDiv.textContent = 'Отправка...';

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ code: code, magazin: selectedStore })
    });
    const data = await res.json();

    if (!data.ok) {
      showResult('error', '❌ Ошибка: ' + (data.error || 'неизвестная'));
    } else if (data.found) {
      let badge = '';
      if (data.reasonType === 'defect') {
        badge = '<div class="badge defect">⚠️ БРАК — впишите дату заявки и SRID вручную</div>';
      } else if (data.reasonType === 'refusal') {
        badge = '<div class="badge refusal">↩️ ОТКАЗ</div>';
      }
      showResult('ok', badge +
        '✅ Найдено:<br>' +
        '<b>' + (data.data.товар || '') + '</b><br>' +
        'Статус: ' + (data.data.статус || '—') + '<br>' +
        'Причина: ' + (data.data.причина || '—') + '<br>' +
        'SRID: ' + (data.data.srid || '— (заполните вручную)'));
    } else {
      showResult('warn', '⚠️ ' + data.message);
    }
  } catch (err) {
    showResult('error', '❌ Не удалось отправить: ' + err.message);
  } finally {
    statusDiv.textContent = 'Наведите камеру на следующий QR-код';
    isProcessing = false;
    document.getElementById('manualCode').value = '';
  }
}

function onScanSuccess(decodedText, decodedResult) {
  const formatName = decodedResult && decodedResult.result && decodedResult.result.format
    ? decodedResult.result.format.formatName
    : (decodedResult && decodedResult.format ? decodedResult.format : 'QR_CODE');
  showDebug(decodedText, formatName);
  submitCode(decodedText);
}

const scanner = new Html5Qrcode('reader', {
  formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ]
});
scanner.start(
  { facingMode: 'environment' },
  { fps: 10, qrbox: 250 },
  onScanSuccess
).catch(function (err) {
  statusDiv.textContent = 'Не удалось запустить камеру: ' + err;
});
</script>

</body>
</html>
